[project]
name = "agentic-shopping-ablation"
version = "0.1.0"
description = "Controlled architectural ablation of reactive and planning-based LLM agents on constrained multi-step web shopping tasks."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sanatan Shrivastava" }
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "boto3>=1.43.29",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
